name: 버튼 클릭 처리

# 텔레그램은 봇에게 클릭 알림을 밀어주지 않습니다. 봇이 물어보러 가야 합니다.
# 개인 PC에는 공개 주소가 없으니 여기서 주기적으로 물어봅니다.
#
# 클릭은 텔레그램이 24시간 보관하므로 유실되지 않습니다. 늦게 도착할 뿐입니다.
#
# 저장소를 공개로 바꾼 뒤로는 Actions 사용 시간에 제한이 없습니다.
# 그래서 하루 종일 5분마다 확인합니다. 언제 눌러도 5분 안에 기사가 옵니다.
#
# (비공개였을 때는 월 2,000분 한도 때문에 낮에는 30분마다밖에 못 돌렸고,
#  그래서 "버튼을 눌러도 반응이 없다"고 느껴졌습니다. 고장이 아니라 대기였습니다)
#
# 5분이 최소 간격입니다. GitHub 은 이보다 짧은 cron 을 받아주지 않습니다.
# 그리고 예약 실행은 부하에 따라 조금씩 늦어질 수 있어 실제로는 5~15분입니다.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# 여러 개가 동시에 돌면 텔레그램 알림을 서로 가로챕니다. 반드시 하나씩 돌려야 합니다.
concurrency:
  group: button-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      TZ: Asia/Seoul
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONIOENCODING: utf-8

    steps:
      # 브리핑 파일을 읽어야 하므로 최신 커밋을 받아옵니다.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 어디까지 처리했는지 기억해 둡니다. 없으면 같은 클릭에 두 번 답장하게 됩니다.
      - name: 처리 위치 복원
        uses: actions/cache/restore@v4
        with:
          path: data/bot_offset.txt
          key: bot-offset-${{ github.run_id }}
          restore-keys: |
            bot-offset-

      # 시크릿에 섞여 들어간 공백·줄바꿈을 제거합니다.
      # (자세한 이유는 daily-brief.yml 의 같은 단계 주석 참고)
      - name: 시크릿 공백 제거
        run: |
          for v in TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            clean=$(printf '%s' "${!v}" | tr -d '[:space:]')
            echo "::add-mask::$clean"
            echo "$v=$clean" >> "$GITHUB_ENV"
          done

      - name: 대기 중인 클릭 처리
        run: python bot_server.py --once

      - name: 처리 위치 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/bot_offset.txt
          key: bot-offset-${{ github.run_id }}
