name: 아침 브리핑 생성

# 매일 한국시간 08:50 에 실행합니다.
# GitHub 의 cron 은 UTC 기준이라 08:50 KST = 23:50 UTC (전날) 입니다.
on:
  schedule:
    - cron: '50 23 * * *'
  workflow_dispatch:        # 필요할 때 손으로 실행하는 버튼

# 만든 브리핑을 저장소에 커밋해야 하므로 쓰기 권한이 필요합니다.
# (버튼을 눌렀을 때 이 파일을 읽어서 보냅니다)
permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      TZ: Asia/Seoul
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Claude Code 설치
        run: npm install -g @anthropic-ai/claude-code

      - name: 설정 확인
        run: |
          for v in TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID CLAUDE_CODE_OAUTH_TOKEN; do
            if [ -z "${!v}" ]; then
              echo "::error::$v 시크릿이 비어 있습니다. 저장소 Settings > Secrets 에서 등록하세요."
              exit 1
            fi
          done
          echo "시크릿 3개 모두 확인됨"

      # 1단계 — 뉴스 수집. 월요일은 주말 기사까지 담기 위해 범위를 넓힙니다.
      - name: 뉴스 수집
        run: |
          if [ "$(date +%u)" = "1" ]; then HOURS=60; else HOURS=24; fi
          echo "수집 범위: 최근 ${HOURS}시간"
          python fetch_news.py --hours "$HOURS"

      # 2단계 — 요약 작성.
      # 발송은 다음 단계가 하므로 파일 읽기·쓰기 권한만 줍니다 (Bash 없음).
      # 프롬프트는 automation/brief_prompt.txt 한 곳에만 둡니다.
      # 내 PC용 스크립트(automation/daily_brief.ps1)도 같은 파일을 읽습니다.
      - name: 항목별 요약 작성
        run: |
          TODAY=$(date +%F)
          PROMPT=$(sed "s/{DATE}/${TODAY}/g" automation/brief_prompt.txt)
          claude -p "$PROMPT" \
            --permission-mode acceptEdits \
            --allowedTools Read Write Glob Grep

      # 파일이 진짜 만들어졌는지 확인합니다.
      # claude 가 성공을 보고했어도 파일이 없으면 빈 메뉴를 보내게 됩니다.
      - name: 작성 결과 확인
        run: |
          TODAY=$(date +%F)
          COUNT=$(ls -1 "briefs/${TODAY}"/*.md 2>/dev/null | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::브리핑 파일이 하나도 만들어지지 않았습니다."
            exit 1
          fi
          echo "브리핑 ${COUNT}개 작성됨:"
          ls -1 "briefs/${TODAY}"

      # 버튼을 눌렀을 때 읽을 수 있도록 저장소에 남깁니다.
      - name: 브리핑 커밋
        run: |
          TODAY=$(date +%F)
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "briefs/${TODAY}"
          if git diff --cached --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "브리핑 ${TODAY}"
            git push
          fi

      # 3단계 — 버튼 메뉴 발송
      - name: 버튼 메뉴 발송
        run: python bot_server.py --send-menu

      # 실패했을 때 조용히 넘어가면 안 됩니다. 텔레그램으로 알려 줍니다.
      - name: 실패 알림
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            --data-urlencode "text=<b>브리핑 생성 실패</b>
          오늘 아침 브리핑을 만들지 못했습니다.
          GitHub 저장소의 Actions 탭에서 기록을 확인해 주세요." || true
