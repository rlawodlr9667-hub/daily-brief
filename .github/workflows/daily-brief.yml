name: 아침 브리핑 생성

# 매일 한국시간 08:50 에 시작해서 09시쯤 텔레그램에 도착하도록 맞췄습니다.
# GitHub 의 cron 은 UTC 기준이라 08:50 KST = 23:50 UTC (전날) 입니다.
#
# 두 번 걸어 둔 이유:
#   GitHub 의 무료 예약 실행은 "정한 시각에 반드시 돌린다"가 아니라
#   "여유가 되면 돌린다" 입니다. 부하가 몰리면 늦추거나 아예 건너뜁니다.
#   실제로 2026-07-27 아침 실행은 실패한 게 아니라 시작조차 하지 않았습니다.
#   그래서 09:40 에 한 번 더 확인합니다. 아침에 정상으로 보냈으면 이 실행은
#   아래 '오늘 무엇이 필요한지 확인' 단계에서 곧바로 끝나므로 낭비가 없습니다.
on:
  schedule:
    - cron: '50 23 * * *'   # 08:50 KST — 평소 실행 (09시경 도착)
    - cron: '40 0 * * *'    # 09:40 KST — 위가 건너뛰었을 때만 대신 실행
  workflow_dispatch:        # 필요할 때 손으로 실행하는 버튼

# 만든 브리핑을 저장소에 커밋해야 하므로 쓰기 권한이 필요합니다.
# (버튼을 눌렀을 때 이 파일을 읽어서 보냅니다)
permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      TZ: Asia/Seoul
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 오늘 할 일을 먼저 정합니다. 백업 실행(09:40)이 아침에 이미 보낸 브리핑을
      # 다시 만들어 두 번 보내는 일을 막습니다.
      #   none = 이미 보냈음        -> 아무것도 안 함
      #   send = 만들었는데 못 보냄 -> 발송만 다시
      #   all  = 처음부터
      - name: 오늘 무엇이 필요한지 확인
        id: plan
        run: |
          TODAY=$(date +%F)
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          if [ -f "briefs/$TODAY/.menu_sent" ]; then
            echo "todo=none" >> "$GITHUB_OUTPUT"
            echo "오늘 브리핑은 이미 보냈습니다. 여기서 끝냅니다."
          elif ls "briefs/$TODAY"/*.md >/dev/null 2>&1; then
            echo "todo=send" >> "$GITHUB_OUTPUT"
            echo "브리핑 파일은 있는데 발송 기록이 없습니다. 발송만 다시 합니다."
          else
            echo "todo=all" >> "$GITHUB_OUTPUT"
            echo "오늘 브리핑을 처음부터 만듭니다."
          fi

      - uses: actions/setup-node@v4
        if: steps.plan.outputs.todo == 'all'
        with:
          node-version: '20'

      - name: Claude Code 설치
        if: steps.plan.outputs.todo == 'all'
        run: npm install -g @anthropic-ai/claude-code

      - name: 설정 확인
        run: |
          for v in TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID CLAUDE_CODE_OAUTH_TOKEN; do
            if [ -z "${!v}" ]; then
              echo "::error::$v 시크릿이 비어 있습니다. 저장소 Settings > Secrets 에서 등록하세요."
              exit 1
            fi
          done
          echo "시크릿 3개 모두 확인됨"

      # 시크릿에 섞여 들어간 공백·줄바꿈을 제거합니다.
      #
      # 왜 필요한가: 터미널에 출력된 토큰이 화면 폭을 넘어 두 줄로 표시되면,
      # 마우스로 복사할 때 줄바꿈이 함께 딸려옵니다. 토큰은 HTTP 헤더로 전송되는데
      # 헤더에는 줄바꿈이 들어갈 수 없어서 'Header has invalid value' 로 실패합니다.
      # 토큰 자체에는 공백이 없으므로 전부 제거해도 안전하고, 원래 값이 복원됩니다.
      - name: 시크릿 공백 제거
        run: |
          for v in TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID CLAUDE_CODE_OAUTH_TOKEN; do
            raw="${!v}"
            clean=$(printf '%s' "$raw" | tr -d '[:space:]')
            # 공백을 뺀 값은 등록된 시크릿과 다른 문자열이라 GitHub 이 자동으로
            # 가려주지 않습니다. 로그에 새어나가지 않도록 직접 가리기를 요청합니다.
            echo "::add-mask::$clean"
            if [ "$raw" != "$clean" ]; then
              echo "$v 에서 공백/줄바꿈을 제거했습니다."
            fi
            echo "$v=$clean" >> "$GITHUB_ENV"
          done

      # 1단계 — 뉴스 수집. 월요일은 주말 기사까지 담기 위해 범위를 넓힙니다.
      - name: 뉴스 수집
        if: steps.plan.outputs.todo == 'all'
        run: |
          if [ "$(date +%u)" = "1" ]; then HOURS=60; else HOURS=24; fi
          echo "수집 범위: 최근 ${HOURS}시간"
          python fetch_news.py --hours "$HOURS"

      # 2단계 — 요약 작성.
      # 발송은 다음 단계가 하므로 파일 읽기·쓰기 권한만 줍니다 (Bash 없음).
      # 프롬프트는 automation/brief_prompt.txt 한 곳에만 둡니다.
      # 내 PC용 스크립트(automation/daily_brief.ps1)도 같은 파일을 읽습니다.
      - name: 항목별 요약 작성
        if: steps.plan.outputs.todo == 'all'
        run: |
          TODAY=$(date +%F)
          PROMPT=$(sed "s/{DATE}/${TODAY}/g" automation/brief_prompt.txt)
          claude -p "$PROMPT" \
            --permission-mode acceptEdits \
            --allowedTools Read Write Glob Grep

      # 파일이 진짜 만들어졌는지 확인합니다.
      # claude 가 성공을 보고했어도 파일이 없으면 빈 메뉴를 보내게 됩니다.
      - name: 작성 결과 확인
        if: steps.plan.outputs.todo == 'all'
        run: |
          TODAY=$(date +%F)
          COUNT=$(ls -1 "briefs/${TODAY}"/*.md 2>/dev/null | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::브리핑 파일이 하나도 만들어지지 않았습니다."
            exit 1
          fi
          echo "브리핑 ${COUNT}개 작성됨:"
          ls -1 "briefs/${TODAY}"

      # 버튼을 눌렀을 때 읽을 수 있도록 저장소에 남깁니다.
      #
      # ★ 이 단계가 빠지면 버튼을 눌러도 아무 기사가 안 나옵니다. ★
      # 버튼 클릭에 답하는 워크플로(button-poll.yml)는 저장소에서 파일을 읽기
      # 때문에, 브리핑이 러너 안에만 있고 커밋되지 않으면 찾지 못합니다.
      - name: 브리핑 커밋
        if: steps.plan.outputs.todo == 'all'
        run: |
          TODAY=$(date +%F)
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "briefs/${TODAY}"
          if git diff --cached --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "브리핑 ${TODAY}"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi

      # 3단계 — 버튼 메뉴 발송
      - name: 버튼 메뉴 발송
        if: steps.plan.outputs.todo != 'none'
        run: python bot_server.py --send-menu

      # 보냈다는 표시를 남깁니다. 09:40 백업 실행이 이걸 보고 그냥 끝냅니다.
      # 발송이 성공한 뒤에만 남기므로, 발송이 실패하면 백업이 다시 시도합니다.
      - name: 발송 기록 남기기
        if: steps.plan.outputs.todo != 'none'
        run: |
          TODAY=$(date +%F)
          date -Iseconds > "briefs/${TODAY}/.menu_sent"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "briefs/${TODAY}/.menu_sent"
          if git diff --cached --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "발송 기록 ${TODAY}"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi

      # 실패했을 때 조용히 넘어가면 안 됩니다. 텔레그램으로 알려 줍니다.
      - name: 실패 알림
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            --data-urlencode "text=<b>브리핑 생성 실패</b>
          오늘 아침 브리핑을 만들지 못했습니다.
          GitHub 저장소의 Actions 탭에서 기록을 확인해 주세요." || true
